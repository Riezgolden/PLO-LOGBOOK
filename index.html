<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLO Receiving Logbook</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2733;--mu:#667085;--bd:#d9dee5;--ac:#1f4e79;--ac2:#e8f0f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--card:#1f242b;--tx:#e8ebef;--mu:#98a2b3;--bd:#343b45;--ac:#6ea8dd;--ac2:#25303c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif}
main{max-width:1300px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:18px;height:18px;padding:0}
button{padding:8px 14px;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:6px;cursor:pointer;font:inherit}
button.g{background:transparent;color:var(--ac)}button.x{padding:3px 8px;background:transparent;color:#c0392b;border-color:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.kpi{font-size:26px;font-weight:700;color:var(--ac)}.sum{display:grid;grid-template-columns:150px 1fr 1fr;gap:14px;align-items:start}
@media(max-width:760px){.sum{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1300px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{background:var(--ac2);font-size:11px;position:sticky;top:0}td.c,th.c{text-align:center;max-width:78px}
.pie{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lg div{font-size:12px;display:flex;align-items:center;gap:5px}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.bar{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:3px}.bar span{width:150px;flex:none}.bar div{height:10px;background:var(--ac);border-radius:3px;min-width:2px}
.mini{margin:0;padding:8px 10px}input.sf{min-width:130px}.mini .kpi{font-size:20px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd img{height:64px;width:auto;flex:none}.hd .sub{margin-bottom:0}h3{margin:0 0 8px;font-size:14px}#st{font-size:12px;color:var(--mu)}
</style></head><body><main>

<div class="card"><h3>New entry</h3>
<div class="grid">
<div><label>Date received</label><input type="date" id="date"></div>
<div><label>Document type</label><select id="type"></select></div>
<div><label>Particulars / Subject</label><input id="subj"></div>
<div><label>From (Office / Sender)</label><input id="from"></div>
<div><label>No. of pages / copies</label><input type="number" id="pages" min="1" value="1"></div>
<div><label>Received by</label><input id="by"></div>
<div><label>Notes</label><input id="note"></div>
<div><label>Sent to (other office)</label><input id="sentTo"></div>
<div><label>Date sent</label><input type="date" id="sentDate"></div>
</div>
<div class="row"><button id="add">Add entry</button><button class="g" id="csv">Export CSV</button></div></div>

<div class="card"><h3>Summary</h3><div class="sum">
<div><label>Total documents received</label><div class="kpi" id="tot">0</div><label>Total pages</label><div class="kpi" id="pg" style="font-size:20px">0</div></div>
<div><h3>By status (checked)</h3><div id="p1"></div></div>
<div><h3>By document type</h3><div class="pie" id="p2"></div></div></div>
<div class="grid" id="kp" style="margin-top:12px"></div><h3 style="margin-top:14px">Sent to other offices</h3><div class="pie" id="p4"></div></div>

<div class="card"><div class="row" style="margin-top:0"><div><label>Show only checked</label><select id="f1"></select></div><div><label>Document type</label><select id="f2"></select></div><div><label>Search</label><input id="q"></div></div>
<div class="tw" style="margin-top:10px"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div></div>
</main>
<script>
const TYPES=["Memorandum of Agreement","Resolution","Ordinance","Contract","Affidavit","Letter / Communication","Endorsement","Other"];
const FL=[['mail','Mailed'],['rev','For Review'],['fini','For Initial'],['ini','Initialed'],['fsig','For Signature'],['sgn','Signed'],['fnot','For Notary'],['nota','Notarized'],['rfa','For RFA'],['endo','Endorsed to Other Office'],['ret','Returned to Source'],['filed','Filed']];
const COL=["#1f4e79","#e07b39","#3a9d5d","#b8433e","#7a5aa6","#2aa1b3","#c9a227","#8a8f98"];
const $=id=>document.getElementById(id);
let rows=[],col=null;
const fill=(el,a,all)=>{el.innerHTML=(all?'<option value="">All</option>':'')+a.map(x=>Array.isArray(x)?`<option value="${x[0]}">${x[1]}</option>`:`<option>${x}</option>`).join('')};
fill($('type'),TYPES);fill($('f1'),FL,1);fill($('f2'),TYPES,1);
$('th').innerHTML='<tr><th>No.</th><th>Date</th><th>Type</th><th>Particulars</th><th>From</th><th class="c">Pages</th><th>Received by</th><th>Notes</th><th>Sent to (office)</th><th>Date sent</th>'+FL.map(f=>`<th class="c">${f[1]}</th>`).join('')+'<th></th></tr>';
$('date').value=new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const on=(r,f)=>r[f]===true||r[f]==='Yes'||(f==='sgn'&&/Signed/.test(r.sig||''))||(f==='ini'&&/Initialed/.test(r.sig||''));
function pie(el,map){const e=Object.entries(map),t=e.reduce((a,b)=>a+b[1],0);
 if(!t){el.innerHTML='<span class="sub">No data</span>';return}
 let a=0,s='<svg width="130" height="130" viewBox="-1 -1 2 2" style="transform:rotate(-90deg)">';
 e.forEach(([k,v],i)=>{const f=v/t,x1=Math.cos(2*Math.PI*a),y1=Math.sin(2*Math.PI*a);a+=f;const x2=Math.cos(2*Math.PI*a),y2=Math.sin(2*Math.PI*a);
  s+=f>=.999?`<circle r="1" fill="${COL[i%8]}"/>`:`<path d="M0 0L${x1} ${y1}A1 1 0 ${f>.5?1:0} 1 ${x2} ${y2}Z" fill="${COL[i%8]}"/>`});
 el.innerHTML=s+'</svg><div class="lg">'+e.map(([k,v],i)=>`<div><i style="background:${COL[i%8]}"></i>${esc(k)}: <b>${v}</b> (${Math.round(v/t*100)}%)</div>`).join('')+'</div>'}
function render(){
 rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0));
 $('tot').textContent=rows.length;$('pg').textContent=rows.reduce((a,r)=>a+(+r.pages||0),0);
 pie($('p2'),rows.reduce((m,r)=>(m[r.type]=(m[r.type]||0)+1,m),{}));
 pie($('p4'),rows.filter(r=>r.sentTo).reduce((m,r)=>(m[r.sentTo]=(m[r.sentTo]||0)+1,m),{}));
 const cnt=FL.map(([f,l])=>[l,rows.filter(r=>on(r,f)).length]),mx=Math.max(1,...cnt.map(c=>c[1]));
 $('p1').innerHTML=cnt.map(([l,v])=>`<div class="bar"><span>${l}</span><div style="width:${v/mx*100}px"></div><b>${v}</b></div>`).join('');
 const both=(a,b)=>rows.filter(r=>on(r,a)&&on(r,b)).length;
 $('kp').innerHTML=[['Signed & Filed',both('sgn','filed')],['Initialed & Filed',both('ini','filed')],['Notarized & Filed',both('nota','filed')],['Signed, Notarized & Filed',rows.filter(r=>on(r,'sgn')&&on(r,'nota')&&on(r,'filed')).length]].map(([k,v])=>`<div class="card mini"><label>${k}</label><div class="kpi">${v}</div></div>`).join('');
 const f1=$('f1').value,f2=$('f2').value,q=$('q').value.toLowerCase();
 $('tb').innerHTML=rows.map((r,i)=>({r,n:i+1})).filter(({r})=>(!f1||on(r,f1))&&(!f2||r.type===f2)&&(!q||JSON.stringify(r).toLowerCase().includes(q)))
 .map(({r,n})=>`<tr><td>${n}</td><td>${esc(r.date)}</td><td>${esc(r.type)}</td><td>${esc(r.subj)}</td><td>${esc(r.from)}</td><td class="c">${esc(r.pages)}</td><td>${esc(r.by)}</td><td>${esc(r.note)}</td><td><input class="sf" data-id="${r.id}" data-f="sentTo" value="${esc(r.sentTo)}" placeholder="Office"></td><td><input type="date" class="sf" data-id="${r.id}" data-f="sentDate" value="${esc(r.sentDate)}"></td>`
 +FL.map(([f])=>`<td class="c"><input type="checkbox" data-id="${r.id}" data-f="${f}"${on(r,f)?' checked':''}></td>`).join('')+`<td><button class="x" data-del="${r.id}">✕</button></td></tr>`).join('')||`<tr><td colspan="${11+FL.length}" class="sub">No entries yet.</td></tr>`}
async function save(r){if(col)try{await col.doc(r.id).set(r)}catch(e){$('st').textContent='Save failed'}else{local()}}
function local(){try{localStorage.setItem('plo',JSON.stringify(rows))}catch(e){}}
$('add').onclick=async()=>{const r={id:'e'+Date.now(),ts:Date.now(),date:$('date').value,type:$('type').value,subj:$('subj').value.trim(),from:$('from').value.trim(),pages:$('pages').value,by:$('by').value.trim(),note:$('note').value.trim(),sentTo:$('sentTo').value.trim(),sentDate:$('sentDate').value};
 if(!r.subj){$('subj').focus();return}
 if(!col){rows.push(r);render()}await save(r);['subj','from','note','sentTo','sentDate'].forEach(k=>$(k).value='');$('pages').value=1};
$('tb').onchange=async e=>{const t=e.target,r=rows.find(x=>x.id===t.dataset.id);if(!r||!t.dataset.f)return;
 FL.forEach(([f])=>{r[f]=on(r,f)});delete r.sig;delete r.rem;r[t.dataset.f]=t.classList.contains('sf')?t.value.trim():t.checked;await save(r);if(!col)render()};
$('tb').onclick=async e=>{const b=e.target,id=b.dataset.del;if(!id)return;if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Sure?';b.style.cssText='background:#c0392b;color:#fff';setTimeout(()=>{b.dataset.arm='';b.textContent='✕';b.style.cssText=''},4000);return}
 if(col)try{await col.doc(id).delete()}catch(x){$('st').textContent='Delete failed: '+(x.code||x.message)}else{rows=rows.filter(r=>r.id!==id);local();render()}};
['f1','f2'].forEach(k=>$(k).onchange=render);$('q').oninput=render;
$('csv').onclick=async()=>{const h=['No.','Date','Type','Particulars','From','Pages','Received by','Notes','Sent to','Date sent',...FL.map(f=>f[1])];
 const t=[h,...rows.map((r,i)=>[i+1,r.date,r.type,r.subj,r.from,r.pages,r.by,r.note,r.sentTo||'',r.sentDate||'',...FL.map(([f])=>on(r,f)?'Yes':'No')])].map(a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
 try{const d=await claude.use('downloads');if(d){await d.save({filename:'PLO_Receiving_Logbook.csv',data:t});return}}catch(e){}
 const u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='PLO_Receiving_Logbook.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)};
(async()=>{try{rows=JSON.parse(localStorage.getItem('plo')||'[]')}catch(e){rows=[]}render();$('st').textContent='local mode';
 try{const d=await claude.use('db');if(!d)return;col=d.collection('entries');rows=[];
  col.onSnapshot(s=>{rows=s.docs.map(x=>({id:x.id,...x.data()}));render();$('st').textContent='shared · synced'},()=>{$('st').textContent='offline'})}catch(e){}})();
</script></body></html>
